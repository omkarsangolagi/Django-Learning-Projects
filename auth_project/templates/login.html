<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <center>
    <div class="form" style="font-size: 35px;">
         <h1>Login Form</h1>
    <form action method="POST">
        {% csrf_token %}
         Username: <input type="text" name="username" required placeholder="enter username" style="font-size: 40px;"> <br> <br>
        Password:  <input type="password" name="password" required placeholder="enter Password" style="font-size: 40px;"><br> <br>
         <input type="submit" value="Login" style="font-size: 30px;">
        

    </form>
    </div>
   </center>
</body>
</html>
