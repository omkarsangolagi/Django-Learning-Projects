{% extends 'base.html' %}{% block title %}Edit staff{% endblock %}{% block content %}
<section class="page"><div class="form-shell"><div class="form-card"><h1>Edit staff member</h1><p>Update the account details for {{ staff.username }}.</p><form method="post">{% csrf_token %}<div class="field"><label for="username">Username</label><input id="username" type="text" name="username" value="{{ staff.username }}" required></div><div class="field"><label for="password">New password <small>(optional)</small></label><div class="password-wrap"><input id="password" type="password" name="password" placeholder="Leave blank to keep the current password"><button class="password-toggle" type="button">Show</button></div></div><button class="btn btn-primary" type="submit">Save changes</button></form><p class="form-note"><a href="{% url 'manage_staff' %}">← Back to staff management</a></p></div></div></section>{% endblock %}
