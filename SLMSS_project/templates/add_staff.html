{% extends 'base.html' %}{% block title %}Add staff{% endblock %}{% block content %}
<section class="page"><div class="form-shell"><div class="form-card"><h1>Add staff member</h1><p>Create login access for a new member of staff.</p><form method="post">{% csrf_token %}<div class="field"><label for="username">Username</label><input id="username" type="text" name="username" required autofocus></div><div class="field"><label for="password">Temporary password</label><div class="password-wrap"><input id="password" type="password" name="password" required><button class="password-toggle" type="button">Show</button></div></div><button class="btn btn-primary" type="submit">Add staff member</button></form><p class="form-note"><a href="{% url 'manage_staff' %}">← Back to staff management</a></p></div></div></section>{% endblock %}
