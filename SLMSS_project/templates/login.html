{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}
<section class="page"><div class="form-shell"><div class="form-card"><h1>Welcome back</h1><p>Sign in to access your leave workspace.</p>
<form method="post">{% csrf_token %}<div class="field"><label for="username">Username</label><input id="username" type="text" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" name="password" autocomplete="current-password" required><button class="password-toggle" type="button">Show</button></div></div><button class="btn btn-primary" type="submit">Sign in</button></form>
<p class="form-note">New to SLMS? <a href="{% url 'register' %}">Create an account</a></p></div></div></section>{% endblock %}
