{% extends 'base.html' %}{% block title %}Apply for leave{% endblock %}{% block content %}
<section class="page"><div class="form-shell"><div class="form-card"><h1>Apply for leave</h1><p>Tell us when you will be away and why.</p><form method="post" data-leave-form>{% csrf_token %}<p class="form-error" role="alert"></p><div class="field"><label for="leave_type">Leave type</label><select id="leave_type" name="leave_type" required><option value="">Select leave type</option><option value="Casual Leave">Casual leave</option><option value="Sick Leave">Sick leave</option><option value="Emergency Leave">Emergency leave</option></select></div><div class="field"><label for="start">Start date</label><input id="start" type="date" name="start" required></div><div class="field"><label for="end">End date</label><input id="end" type="date" name="end" required></div><div class="field"><label for="reason">Reason</label><textarea id="reason" name="reason" placeholder="Briefly explain your request" required></textarea></div><button class="btn btn-primary" type="submit">Submit request</button></form><p class="form-note"><a href="{% url 'staff_dashboard' %}">← Back to dashboard</a></p></div></div></section>{% endblock %}
