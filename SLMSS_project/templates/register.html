{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}
<section class="page"><div class="form-shell"><div class="form-card"><h1>Create an account</h1><p>Set up your Staff Leave Management profile.</p><form method="post">{% csrf_token %}<div class="field"><label for="username">Username</label><input id="username" type="text" name="username" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" name="password" required><button class="password-toggle" type="button">Show</button></div></div><div class="field"><label for="role">Role</label><select id="role" name="role" required><option value="">Select a role</option><option value="admin">Administrator</option><option value="Staff">Staff member</option></select></div><button class="btn btn-primary" type="submit">Create account</button></form><p class="form-note">Already registered? <a href="{% url 'login' %}">Sign in</a></p></div></div></section>{% endblock %}
