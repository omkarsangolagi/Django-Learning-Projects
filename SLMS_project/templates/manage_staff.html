<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage staff</title>
</head>
<body>
    <center>
    <h2>Manage staff</h2>
    <a href="{% url 'add_staff' %}">+add staff</a>
    <table border="2px">
        <tr>
            <th>Username</th>
            <th>Actions</th>
        </tr>
    {% for i in staff_list %}

    <tr>
        <td>
            {{ i.username}}
        </td>
        <td>
            <a href="#">Edit</a>
            <a href="#" onclick="return confirm('are you sure?')">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td>No Staff found</td></tr>
    {% endfor %}
    </table>
    <br>
    <a href="{% url 'admin_dashboard' %}">Back to dashboard</a>
    </center>
</body>
</html>
