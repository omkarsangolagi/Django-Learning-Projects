<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>my leave applications</h1>
        <table border="2px">
            <tr>
                <th>Leave type</th>
                <th>start Date</th>
                <th>End date</th>
                <th>Reason</th>
                <th>status</th>
            </tr>
            {% for i in leaves %}
            <tr>
                <td>{{ i.leave_type }}</td>
                <td>{{ i.start_date }}</td>
                <td>{{ i.end_date }}</td>
                <td>{{ i.Reason }}</td>
                <td>{{ i.status }}</td>
            </tr>
            {% endfor %}
        </table>
        <a href="{% url 'staff_dashboard' %}">back to dashboard</a>
    </center>
</body>
</html>
