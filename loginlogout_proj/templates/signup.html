<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
</head>
<body>
    <center>
        <h1>Sign up and login</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register and login</button>
        </form>

        <br><br>
        <p>already have an account <a href="{% url 'login' %}">login</a></p>
    </center>
</body>
</html>
